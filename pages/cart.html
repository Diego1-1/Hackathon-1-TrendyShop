<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito | TrendyShop</title>

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/cart.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <app-navbar active="carrito"></app-navbar>

  <main class="cart-page">
    <h1>Tu carrito</h1>

    <section id="cartItems" aria-live="polite"></section>

    <div id="cartSummary" class="cart-summary" hidden>
      <p class="cart-total">Total: <strong id="cartTotal">$0.00</strong></p>
      <div class="cart-actions">
        <button type="button" id="clearBtn" class="btn-secondary">Vaciar carrito</button>
        <button type="button" id="checkoutBtn" class="btn-primary">Finalizar compra</button>
      </div>
    </div>
  </main>

  <app-footer></app-footer>

  <!-- AJUSTA: el mismo script que registra <app-navbar> en el catálogo -->
  <script type="module" src="../components/navbar.js"></script>
  <script type="module" src="../components/footer.js"></script>
  <script type="module" src="../js/cart-page.js"></script>
  
</body>
</html>
